<div style="background: #f4f6fa; min-height: 960px; padding: 40px 48px; display: flex; flex-direction: column; gap: 48px;">
  <div class="spread">
    <a class="brand" href="Landing.dc.html" style="padding: 0;"><span class="mark"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 20a10 10 0 0 0 1.5-5.5V12a2 2 0 0 1 4 0v1.5"/><path d="M5 17a13 13 0 0 0 1-4.5V12a6 6 0 0 1 12 0v2a14 14 0 0 1-1 5"/><path d="M14 17.5a12 12 0 0 1-1 3"/></svg></span>Tapit</a>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 24px;">

      <div class="col-2">
        <p class="eyebrow">Invitation</p>
        <h1 class="t-xl">Set up your Tapit account</h1>
        <p class="t-sm muted">You were invited as <span class="strong" style="color: #1b2433;">ana@bakery.test</span>. Choose a password to continue.</p>
      </div>
      <div class="field"><label for="st-pass">Password</label><input class="input" id="st-pass" type="password" value="••••••••••"></div>
      <div class="field"><label for="st-conf">Confirm password</label><input class="input" id="st-conf" type="password"></div>
      <div class="col-2">
        <div class="progress"><span style="width: 70%; background: #10543f;"></span></div>
        <p class="hint">Strong. At least 8 characters with a number.</p>
      </div>
      <a class="btn btn-primary btn-lg" href="Onboarding.dc.html">Continue</a>
    </div>
    <p class="t-sm muted">Link not working? <a href="Account.dc.html">Contact support</a></p>
  </div>
</div>
