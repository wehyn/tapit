<html lang="en">
<head>
<meta charset="utf-8">
<title>Set up your card · Tapit</title>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#315fe4}a:hover{color:#1b2433}
</style>
</helmet>
<div class="m">
  <div class="m-top">
    <a class="brand" href="Landing.dc.html" style="padding: 0;"><span class="mark"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 20a10 10 0 0 0 1.5-5.5V12a2 2 0 0 1 4 0v1.5"/><path d="M5 17a13 13 0 0 0 1-4.5V12a6 6 0 0 1 12 0v2a14 14 0 0 1-1 5"/><path d="M14 17.5a12 12 0 0 1-1 3"/></svg></span>Tapit</a>
    <a class="btn btn-quiet" href="Login.dc.html">Sign in</a>
  </div>
  <div class="m-body" style="justify-content: center; gap: 24px;">
    <div style="align-self: center; width: 240px; aspect-ratio: 1.586; border-radius: 20px; background: #1b2433; color: #fff; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 20px 56px rgb(27 36 51 / .2);">
      <svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true" style="color: #c9a875; align-self: flex-end;"><path d="M6 8a6 6 0 0 1 0 8M10 5a10 10 0 0 1 0 14M14 2a14 14 0 0 1 0 20"/></svg>
      <p class="t-sm strong">Your Tapit card</p>
    </div>
    <div class="col-2" style="text-align: center; align-items: center;">
      <p class="eyebrow">New card</p>
      <h1 class="t-xl">This card is ready to set up</h1>
      <p class="t-sm muted">Enter the claim code that came with it. The card will open your profile from now on.</p>
    </div>
    <div class="card" style="padding: 16px;">
      <label class="t-sm strong" for="cc-1">Claim code</label>
      <div class="row-2" style="justify-content: space-between;">
        <input class="input" id="cc-1" value="K" aria-label="Character 1" style="width: 44px; padding: 0; text-align: center; font-size: 20px; font-weight: 650;">
        <input class="input" value="7" aria-label="Character 2" style="width: 44px; padding: 0; text-align: center; font-size: 20px; font-weight: 650;">
        <input class="input" value="Q" aria-label="Character 3" style="width: 44px; padding: 0; text-align: center; font-size: 20px; font-weight: 650;">
        <span class="muted">–</span>
        <input class="input" value="2" aria-label="Character 4" style="width: 44px; padding: 0; text-align: center; font-size: 20px; font-weight: 650;">
        <input class="input" aria-label="Character 5" style="width: 44px; padding: 0; text-align: center; font-size: 20px; font-weight: 650; outline: 3px solid #3f6de8; outline-offset: 2px; background: #fff;">
        <input class="input" aria-label="Character 6" style="width: 44px; padding: 0; text-align: center; font-size: 20px; font-weight: 650;">
      </div>
      <p class="hint">Codes are 6 characters and expire after 24 hours.</p>
      <a class="btn btn-primary btn-lg" href="Login.dc.html">Continue</a>
    </div>
    <p class="t-sm muted" style="text-align: center;">No code? <a href="Account.dc.html">Contact support</a></p>
  </div>
</div>
</x-dc>
